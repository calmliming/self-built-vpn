  function retryTask(id){

    const results=task.serverIds.map(serverId=>({serverId,status:serverById(serverId)?.online?'success':'pending',label:serverById(serverId)?.online?'已生效':'待同步'}));
    const remaining=results.filter(item=>item.status==='pending').map(item=>item.serverId);
    const collection=id.startsWith('revoke:')?state.revocations:state.maintenance;const item=collection.find(row=>row.id===id.slice(id.indexOf(':')+1));
    if(item)item.serverIds=remaining;

    record('订阅管理','重试同步',task.name,task.label,results);persist();closeDialog();render();toast(remaining.length?'部分服务器仍待同步。':'同步任务已完成。',remaining.length?'amber':'green');

      case 'update-rules':updateRules();break;
      case 'save-rules':saveRules();break;
      case 'preview-config':showConfig();break;
      case 'download-config':download('self-vpn-example.yaml',configPreview());toast('示例配置已下载。');break;
      case 'download-sub':{const sub=subById(id);if(sub){download(sub.name+'-example.yaml',configPreview(sub));toast('示例配置已下载。');}break;}
      case 'settings-tab':ui.settingsTab=id;render();break;
      case 'save-settings':$('#'+(ui.settingsTab==='security'?'security-settings':'general-settings'))?.requestSubmit();break;
      case 'create-backup':createBackup();break;
      case 'restore-backup':showRestore(id);break;
      case 'export-backup':download('self-vpn-prototype-'+stamp().slice(0,10)+'.json',JSON.stringify(snapshot(),null,2),'application/json');toast('示例数据备份已导出。');break;
      case 'reset-demo':showResetDemo();break;
      case 'export-audit':{
        const cell=value=>{let text=String(value??'');if(/^[=+@-]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';};
        const rows=[['时间','操作者','模块','操作','对象','结果','变更摘要'],...state.audit.map(item=>[item.time,item.actor,item.module,item.action,item.object,statusLabels[item.status],item.summary])];
        download('self-vpn-操作日志.csv','\ufeff'+rows.map(row=>row.map(cell).join(',')).join('\n'),'text/csv;charset=utf-8');toast('操作日志已导出。');break;
      }
      case 'export-diagnostics':download('self-vpn-诊断报告.json',JSON.stringify(state.diagnostics,null,2),'application/json');toast('诊断报告已导出。');break;
      case 'demo-menu':showMenu([{label:'香港恢复在线',action:'demo-hk-online',icon:'checkCircle'},{label:'香港离线场景',action:'demo-hk-offline',icon:'clock'},'divider',{label:'恢复初始示例',action:'reset-demo',icon:'refresh'}],element);break;
      case 'demo-hk-online':
      case 'demo-hk-offline':{
        const server=serverById('HK-01');if(!server)break;server.online=action==='demo-hk-online';
        record('服务器管理','切换示例场景',server.id,server.online?'香港恢复在线，等待重试同步':'香港离线，其他地区继续运行');
        persist();render();toast(server.online?'香港已恢复在线，可重试待同步任务。':'已切换为香港离线的示例场景。');break;
      }
    }
  }
  async function handleSubmit(form){
    const fields=new FormData(form),id=form.dataset.id||'';
    switch(form.dataset.form){
      case 'server':{
        const ip=String(fields.get('ip')).trim();if(!validIP(ip)){toast('请输入有效的 IPv4 地址。','amber');form.elements.ip.focus();return;}
        if(state.servers.some(server=>server.id!==id&&server.ip===ip)){toast('此服务器地址已存在。','amber');return;}
        const existing=serverById(id),country=String(fields.get('country'));const key=form.elements.keyFile.files[0]?.name||existing?.keyName||'';
        const server={...(existing||{}),id:existing?.id||country+'-'+String(state.servers.filter(server=>server.country===country).length+1).padStart(2,'0'),name:String(fields.get('name')).trim(),country,region:regionName(country),ip,sshUser:String(fields.get('sshUser')).trim(),sshPort:Number(fields.get('sshPort')),keyName:key,online:existing?.online??true};
        if(!server.name){toast('请填写服务器名称。','amber');return;}
        if(existing)Object.assign(existing,server);else state.servers.push(server);
        record('服务器管理',existing?'修改服务器':'添加服务器',server.id,'保存地区和连接参数',[{serverId:server.id,status:'success',label:'已保存'}]);refreshAfterSave('服务器已保存。');break;
      }
      case 'node':{
        const port=Number(fields.get('port')),protocol=String(fields.get('protocol')),serverId=String(fields.get('serverId'));
        if(state.nodes.some(node=>node.id!==id&&node.serverId===serverId&&node.port===port&&node.protocol===protocol)){toast('此服务器上已存在相同的协议入口。','amber');return;}
        const node={id:id||uid('node'),name:String(fields.get('name')).trim(),serverId,protocol,port,enabled:true,label:protocol==='REALITY'?'VLESS · REALITY':protocol==='Trojan'?'Trojan · TLS':'Hysteria2',transport:protocol==='Hysteria2'?'UDP':'TCP'};
        const existing=state.nodes.find(item=>item.id===id);if(existing)Object.assign(existing,node);else state.nodes.push(node);
        ui.nodeId=node.id;record('节点管理',existing?'修改节点':'新增节点',node.name,'保存协议和监听端口',[{serverId,status:'success',label:'已保存'}]);refreshAfterSave('节点配置已保存。');break;
      }
      case 'subscription':{
        const name=String(fields.get('name')).trim(),scope=fields.getAll('regions'),protocols=fields.getAll('protocols');
        if(!name){toast('请填写订阅名称。','amber');return;}
        if(state.subscriptions.some(sub=>sub.id!==id&&sub.name===name)){toast('已存在同名订阅，请换一个名称。','amber');return;}
        if(!scope.length||!protocols.length){toast('至少选择一个地区和一种协议。','amber');return;}
        const existing=subById(id);const permissionsChanged=!existing||JSON.stringify(existing.regions)!==JSON.stringify(scope)||JSON.stringify(existing.protocols)!==JSON.stringify(protocols)||existing.enabled!==fields.has('enabled');
        const sub=existing||{id:uid('sub'),kind:'link',linkVersion:1,credentialVersion:1,lastPull:'尚未拉取',sync:{}};
        Object.assign(sub,{name,notes:String(fields.get('notes')).trim(),regions:scope,protocols,strategy:String(fields.get('strategy')),enabled:fields.has('enabled')});
        if(!existing)state.subscriptions.push(sub);
        const results=permissionsChanged?applySync(sub):scopedServers(sub).map(server=>({serverId:server.id,status:sub.sync[server.id]?.pending?'pending':'success',label:sub.sync[server.id]?.pending?'待同步':'已生效'}));
        ui.subId=sub.id;record('订阅管理',existing?'修改订阅':'新建订阅',sub.name,'授权地区：'+scope.map(regionName).join('、'),results,{subId:sub.id});
        ui.filters.subscriptions={status:'all',query:''};persist();closeDialog();navigate('subscriptions');toast('订阅已'+(existing?'保存':'创建')+(isPending(sub)?'，离线地区待同步。':'。'),isPending(sub)?'amber':'green');break;
      }
      case 'reset-subscription':{
        const sub=subById(id);if(!sub)return;const all=fields.get('scope')==='all';
        if(all&&!fields.has('acknowledged'))return;
        sub.linkVersion++;let results;
        if(all){sub.credentialVersion++;results=applySync(sub);}
        else{const host=serverById(state.settings.hostServer);results=host?[{serverId:host.id,status:host.online?'success':'pending',label:host.online?'已更新':'待同步'}]:[];}
        record('订阅管理',all?'重置全部凭据':'重置链接',sub.name,all?'更换链接、UUID 和密码，客户端需重新导入':'更换下载地址，节点凭据保留',results,{subId:sub.id});
        refreshAfterSave(all?'链接与节点凭据已重置'+(isPending(sub)?'，离线地区待同步。':'。'):'订阅链接已重置，节点凭据保留。',all&&isPending(sub)?'amber':'green');break;
      }
      case 'delete-subscription':{
        const sub=subById(id);if(!sub)return;sub.enabled=false;const results=applySync(sub);
        const pending=results.filter(result=>result.status==='pending').map(result=>result.serverId);
        if(pending.length)state.revocations.push({id:uid('revocation'),name:sub.name,serverIds:pending});
        record('订阅管理','删除订阅',sub.name,'删除下载入口并撤销此订阅的独立权限',results);
        state.subscriptions=state.subscriptions.filter(item=>item.id!==id);state.rules.selected=state.rules.selected.filter(item=>item!==id);
        refreshAfterSave('订阅已删除，操作记录已保留'+(pending.length?'，离线地区撤销任务待同步。':'。'),pending.length?'amber':'green');break;
      }
      case 'run-diagnostics':await runDiagnostic(String(fields.get('serverId')));break;
      case 'general-settings':{
        if(state.settings.localOnly&&fields.get('listen')!=='127.0.0.1'){toast('当前为仅本机访问，请使用 127.0.0.1。','amber');return;}
        Object.assign(state.settings,{listen:String(fields.get('listen')).trim(),port:Number(fields.get('port')),language:String(fields.get('language')),serviceUrl:String(fields.get('serviceUrl')).trim(),hostServer:String(fields.get('hostServer')),interval:Number(fields.get('interval')),certificateHours:Number(fields.get('certificateHours')),logDays:Number(fields.get('logDays'))});
        record('系统设置','保存设置','本机面板','更新常规设置与维护参数');refreshAfterSave('系统设置已保存。');break;
      }
      case 'security-settings':{
        state.settings.localOnly=fields.has('localOnly');state.settings.maskLogs=fields.has('maskLogs');
        if(state.settings.localOnly)state.settings.listen='127.0.0.1';
        record('系统设置','保存安全设置','本机面板','更新访问与日志显示偏好');refreshAfterSave('安全设置已保存。');break;
      }
      case 'restore-backup':{
        const backup=state.backups.find(item=>item.id===id);if(!backup||!validState(backup.data))return;
        const backups=state.backups;state=clone(backup.data);state.backups=backups;record('系统设置','恢复备份',backup.name,'恢复已保存的示例状态');refreshAfterSave('备份已恢复。');break;
      }
      case 'reset-demo':state=seed();persist();closeDialog();setNavigation(false);ui.filters={};ui.subId='sub-work';ui.nodeId='SG-01-3';ui.auditId='TASK-028';ui.diagnosticId='DIAG-030';navigate('overview');toast('已恢复初始示例。');break;
    }
  }
  document.addEventListener('click',event=>{
    if(event.target.closest('.skip-link')){event.preventDefault();$('#main').focus();return;}
    const actionElement=event.target.closest('[data-action]');
    if(actionElement){handleAction(actionElement.dataset.action,actionElement).catch(error=>{console.error(error);toast('操作未完成，请检查输入后重试。','red');});}
    else if(!event.target.closest('#popover'))closeMenu();
    if(event.target.closest('.nav-link'))setNavigation(false);
  });
  document.addEventListener('submit',event=>{
    if(!event.target.matches('form[data-form]'))return;event.preventDefault();
    handleSubmit(event.target).catch(error=>{console.error(error);toast('保存未完成，请检查输入。','red');});
  });
  document.addEventListener('input',event=>{
    const target=event.target;
    if(target.matches('input[data-filter][type=search]')){ui.filters[ui.page]??={};ui.filters[ui.page][target.dataset.filter]=target.value;ui.nodePage=1;render();}
  });
  document.addEventListener('change',async event=>{
    const target=event.target;
    if(target.matches('[data-filter]')&&!target.matches('[type=search]')){ui.filters[ui.page]??={};ui.filters[ui.page][target.dataset.filter]=target.value;ui.nodePage=1;render();}
    if(target.matches('[data-rule]')){if(!target.checkValidity()){target.reportValidity();return;}state.rules[target.dataset.rule]=Number(target.value);persist();}
    if(target.matches('[data-rule-sub]')){const id=target.dataset.ruleSub;state.rules.selected=target.checked?[...new Set([...state.rules.selected,id])]:state.rules.selected.filter(item=>item!==id);persist();}
    if(target.matches('[name=keyFile]')){const label=$('[data-file-label]',target.closest('label'));if(label)label.textContent=target.files[0]?.name||'选择本机私钥';}
    if(target.closest('form[data-form=subscription]')&&target.matches('[name=regions],[name=protocols]'))updateSubScopePreview(target.closest('form'));
    if(target.closest('form[data-form=reset-subscription]')&&target.matches('[name=scope],[name=acknowledged]'))updateResetForm(target.closest('form'));
    if(target.matches('[data-node-protocol]')){const field=target.closest('form').elements.port;field.value=target.value==='REALITY'?443:target.value==='Trojan'?20002:20003;}
    if(target.id==='backup-import'&&target.files[0]){
      try{const file=target.files[0];if(file.size>2_000_000)throw new Error('size');const imported=JSON.parse(await file.text());if(!validState(imported))throw new Error('schema');
        const backups=state.backups;state=imported;state.backups=backups;record('系统设置','导入备份',file.name,'恢复导入的示例状态');persist();render();toast('备份已导入。');
      }catch{toast('备份格式无效，请选择此原型导出的 JSON 文件。','red');target.value='';}
    }
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){closeMenu();setNavigation(false);}
    const menu=$('#popover');
    if(!menu.hidden&&['ArrowDown','ArrowUp'].includes(event.key)){
      event.preventDefault();const items=$$('button',menu),index=items.indexOf(document.activeElement),next=(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;items[next]?.focus();
    }
  });
  $('#dialog').addEventListener('click',event=>{
    if(event.target!==$('#dialog'))return;const rect=$('#dialog').getBoundingClientRect();
    if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog();
  });
  window.addEventListener('resize',closeMenu);
  window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);ui.page=nav.some(item=>item[0]===page)?page:'overview';closeDialog();closeMenu();render();window.scrollTo({top:0,behavior:'instant'});});
  ui.page=nav.some(item=>item[0]===location.hash.slice(1))?location.hash.slice(1):'overview';
  render();
})();

</script>
</body>
